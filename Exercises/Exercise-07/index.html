<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simplified Animation</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .canvas {
      width: 900px;
      height: 556px;
      background: white;
      position: relative;
      border: solid #444 4px;
      overflow: hidden;
    }

    .left-block {
      width: 140px;
      height: 240px;
      background: #b5ead7;
      border-radius: 0 60px 0 0;
      position: absolute;
      bottom: 80px;
      left: 80px;
      box-shadow: inset -20px 0 #1d1b56;
    }

    .platform {
      width: 300px;
      height: 60px;
      background: #a9a9a9;
      position: absolute;
      bottom: 60px;
      left: 280px;
      border-radius: 50%;
    }

    .sphere {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      position: absolute;
      animation: pulse 2.5s infinite ease-in-out;
    }

    .sphere1 { background: #ffe0e0; top: 160px; left: 300px; animation-delay: 0s; }
    .sphere2 { background: #888; top: 120px; left: 360px; animation-delay: 0.2s; }
    .sphere3 { background: #dfbfbf; top: 140px; left: 420px; animation-delay: 0.4s; }
    .sphere4 { background: #ccc; top: 200px; left: 340px; animation-delay: 0.6s; }
    .sphere5 { background: #ddd; top: 220px; left: 400px; animation-delay: 0.8s; }

    .abstract-figure {
      width: 140px;
      height: 100px;
      background: #fdf5e6;
      position: absolute;
      transform: rotate(-20deg);
      top: 260px;
      left: 500px;
      clip-path: polygon(0 0, 100% 30%, 80% 100%, 0% 100%);
    }

    .dark-base {
      width: 300px;
      height: 50px;
      background: #1d1b56;
      position: absolute;
      bottom: 10px;
      right: 80px;
      box-shadow: 60px 0 #eeeeee inset;
    }

    .moving-square {
      width: 100px;
      height: 100px;
      background: #ff9a8b;
      position: absolute;
      top: 100px;
      left: 100px;
      animation: slide 4s infinite alternate ease-in-out;
      box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.2);
    }

    /* Animations */
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    @keyframes slide {
      0% { transform: translateX(0); }
      100% { transform: translateX(200px); }
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="left-block"></div>
    <div class="platform"></div>
    <div class="sphere sphere1"></div>
    <div class="sphere sphere2"></div>
    <div class="sphere sphere3"></div>
    <div class="sphere sphere4"></div>
    <div class="sphere sphere5"></div>
    <div class="abstract-figure"></div>
    <div class="dark-base"></div>
    <div class="moving-square"></div>
  </div>
</body>
</html>
