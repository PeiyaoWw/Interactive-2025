<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandpa's Spirit</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            text-align: center;
            background-color: #2c2f33;
            color: #fff;
            font-family: 'VT323', monospace;
            font-size: 24px;
        }
        
        .message {
            margin-top: 20px;
            font-size: 30px;
        }

        .grandpa {
            width: 128px;
            height: 128px;
            display: block;
            margin: 30px auto;
            animation: waveAnimation 1s infinite alternate ease-in-out;
            image-rendering: pixelated; /* Ensures pixelated look */
        }

        @keyframes waveAnimation {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-10px); }
        }

        button {
            padding: 10px 15px;
            border: none;
            cursor: pointer;
            font-size: 20px;
            font-family: 'VT323', monospace;
            margin-top: 20px;
            border-radius: 5px;
        }

        #toggleMusic {
            background: #7289da;
            color: white;
        }

        #backToHome {
            background: #ff5555;
            color: white;
        }

        button:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <!-- Grandpa's Image (Animated) -->
    <img id="grandpa" class="grandpa" src="images/Grandpa.png" alt="Grandpa's Spirit">
    
    <!-- Message -->
    <h1 class="message">"I am always watching over you, my dear farmer..."</h1>
    <p>Grandpa's voice echoes in the wind.</p>

    <!-- Background Music (Autoplay & Loop) -->
    <audio id="grandpaTheme" autoplay loop>
        <source src="audio/Grandpa_Theme.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <!-- Music Control Button -->
    <button id="toggleMusic">Pause Music</button>

    <!-- Back to Home Button -->
    <button id="backToHome">Back to Home</button>

    <script>
        // Image swap effect (makes Grandpa appear to wave)
        let grandpaImage = document.getElementById("grandpa");
        let images = ["images/Grandpa.png", "images/Grandpa02.png"];
        let index = 0;

        setInterval(() => {
            index = (index + 1) % images.length;
            grandpaImage.src = images[index];
        }, 500); // Swap every 0.5 seconds for a smooth waving effect

        // Ensure audio plays even if the browser blocks autoplay
        let audio = document.getElementById('grandpaTheme');
        document.addEventListener('click', () => {
            audio.play();
        }, { once: true });

        // Toggle music play/pause
        document.getElementById('toggleMusic').addEventListener('click', function () {
            if (audio.paused) {
                audio.play();
                this.textContent = "Pause Music";
            } else {
                audio.pause();
                this.textContent = "Play Music";
            }
        });

        // Back to home button function
        document.getElementById('backToHome').addEventListener('click', function () {
            window.location.href = "index.html"; // Change "index.html" to your actual home page URL
        });
    </script>

</body>
</html>
