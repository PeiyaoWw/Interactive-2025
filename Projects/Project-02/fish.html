<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Static Ocean Fishing</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    body {
      background-color: #87CEEB;
      overflow: hidden;
      margin: 0;
      text-align: center;
      font-family: 'Press Start 2P', cursive;
    }
    #ocean {
      position: relative;
      width: 100vw;
      height: 70vh;
      background: linear-gradient(#3B9C9C, #1B4F72);
    }
    .fish {
      position: absolute;
      width: 50px;
    }
    .fish-name {
      position: absolute;
      background: rgba(255, 255, 255, 0.8);
      padding: 2px 5px;
      font-size: 12px;
      border-radius: 3px;
      font-weight: bold;
    }
    #inventory {
      background: #fff;
      padding: 10px;
      margin-top: 10px;
    }
    .button {
      background-color: #3d5c2b;
      color: white;
      font-size: 20px;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 5px;
      margin-top: 20px;
      display: inline-block;
      text-decoration: none;
    }
    .button:hover {
      background-color: #2a3f1e;
    }
  </style>
</head>
<body>
  <h1>Static Ocean Fishing</h1>
  <div id="ocean">
    <!-- Fish placements -->
    <img src="images/Tuna.png" class="fish" style="top: 50px; left: 80px;" />
    <div class="fish-name" style="top: 50px; left: 80px;">Tuna</div>

    <img src="images/Pufferfish.png" class="fish" style="top: 100px; left: 200px;" />
    <div class="fish-name" style="top: 100px; left: 200px;">Pufferfish</div>

    <img src="images/Anchovy.png" class="fish" style="top: 180px; left: 50px;" />
    <div class="fish-name" style="top: 180px; left: 50px;">Anchovy</div>

    <img src="images/Octopus.png" class="fish" style="top: 240px; left: 300px;" />
    <div class="fish-name" style="top: 240px; left: 300px;">Octopus</div>

    <img src="images/Sea_Cucumber.png" class="fish" style="top: 100px; left: 500px;" />
    <div class="fish-name" style="top: 100px; left: 500px;">Sea Cucumber</div>

    <img src="images/Sardine.png" class="fish" style="top: 150px; left: 400px;" />
    <div class="fish-name" style="top: 150px; left: 400px;">Sardine</div>

    <img src="images/Red_Snapper.png" class="fish" style="top: 220px; left: 600px;" />
    <div class="fish-name" style="top: 220px; left: 600px;">Red Snapper</div>

    <img src="images/Flounder.png" class="fish" style="top: 300px; left: 100px;" />
    <div class="fish-name" style="top: 300px; left: 100px;">Flounder</div>

    <img src="images/Squid.png" class="fish" style="top: 60px; left: 700px;" />
    <div class="fish-name" style="top: 60px; left: 700px;">Squid</div>

    <img src="images/Super_Cucumber.png" class="fish" style="top: 320px; left: 400px;" />
    <div class="fish-name" style="top: 320px; left: 400px;">Super Cucumber</div>

    <img src="images/Glacierfish.png" class="fish" style="top: 180px; left: 800px;" />
    <div class="fish-name" style="top: 180px; left: 800px;">Glacierfish</div>

    <img src="images/Blobfish.png" class="fish" style="top: 260px; left: 680px;" />
    <div class="fish-name" style="top: 260px; left: 680px;">Blobfish</div>
  </div>

  <div id="inventory">Caught Fish: <span id="caught-count">0</span></div>

  <a href="index.html" class="button">🏠 Back to Home</a>
</body>
</html>
