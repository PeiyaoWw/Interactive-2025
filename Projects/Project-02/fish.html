<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Ocean Fishing</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #87CEEB;
            overflow: hidden;
            margin: 0;
            text-align: center;
            font-family: 'Press Start 2P', cursive;
        }
        #ocean {
            position: relative;
            width: 100vw;
            height: 70vh;
            background: linear-gradient(#3B9C9C, #1B4F72);
        }
        .fish {
            position: absolute;
            width: 50px;
            cursor: pointer;
        }
        .fish-name {
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            padding: 2px 5px;
            font-size: 12px;
            border-radius: 3px;
            font-weight: bold;
            font-family: 'Press Start 2P', cursive;
        }
        #inventory {
            background: #fff;
            padding: 10px;
            margin-top: 10px;
            font-family: 'Press Start 2P', cursive;
        }
        .button {
            background-color: #3d5c2b;
            color: white;
            font-size: 20px;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            font-family: 'Press Start 2P', cursive;
            margin-top: 20px;
            display: inline-block;
            text-decoration: none;
        }
        .button:hover {
            background-color: #2a3f1e;
        }
    </style>
</head>
<body>
    <h1>Interactive Ocean Fishing</h1>
    <div id="ocean"></div>
    <div id="inventory">Caught Fish: <span id="caught-count">0</span></div>
    <a href="index.html" class="button">🏠 Back to Home</a>
    
    <script>
        const ocean = document.getElementById("ocean");
        const inventory = document.getElementById("caught-count");
        let fishCount = 0;
        
        const fishData = [
            { src: "images/Tuna.png", name: "Tuna" },
            { src: "images/Pufferfish.png", name: "Pufferfish" },
            { src: "images/Anchovy.png", name: "Anchovy" },
            { src: "images/Sardine.png", name: "Sardine" },
            { src: "images/Red_Snapper.png", name: "Red Snapper" },
            { src: "images/Flounder.png", name: "Flounder" },
            { src: "images/Octopus.png", name: "Octopus" },
            { src: "images/Squid.png", name: "Squid" },
            { src: "images/Midnight_Squid.png", name: "Midnight Squid" },
            { src: "images/Spook_Fish.png", name: "Spook Fish" },
            { src: "images/Blobfish.png", name: "Blobfish" },
            { src: "images/Super_Cucumber.png", name: "Super Cucumber" },
            { src: "images/Sea_Cucumber.png", name: "Sea Cucumber" },
            { src: "images/Lava_Eel.png", name: "Lava Eel" },
            { src: "images/Eel.png", name: "Eel" },
            { src: "images/Glacierfish.png", name: "Glacierfish" },
            { src: "images/Crimsonfish.png", name: "Crimsonfish" },
            { src: "images/Angler.png", name: "Angler" },
            { src: "images/Legend.png", name: "Legend" },
            { src: "images/Legend_II.png", name: "Legend II" }
        ];

        function spawnFish() {
            const fishInfo = fishData[Math.floor(Math.random() * fishData.length)];
            const fish = document.createElement("img");
            fish.src = fishInfo.src;
            fish.classList.add("fish");
            fish.style.top = Math.random() * (ocean.clientHeight - 50) + "px";
            fish.style.left = Math.random() * (ocean.clientWidth - 50) + "px";
            fish.style.transition = "all 2s linear";
            
            const fishName = document.createElement("div");
            fishName.classList.add("fish-name");
            fishName.innerText = fishInfo.name;
            fishName.style.top = fish.style.top;
            fishName.style.left = fish.style.left;
            
            fish.addEventListener("click", function() {
                fish.remove();
                fishName.remove();
                fishCount++;
                inventory.innerText = fishCount;
                spawnFish(); // Spawn another fish after catching
            });
            
            ocean.appendChild(fish);
            ocean.appendChild(fishName);
        }

        for (let i = 0; i < 7; i++) {
            spawnFish();
        }
    </script>
</body>
</html>
