<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stardew Valley - Animals</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            text-align: center;
            background-color: #FFD700; /* Bright yellow background */
            font-family: 'Press Start 2P', cursive, sans-serif;
            color: #fff;
            overflow-x: hidden;
        }

        /* Pixelated 3D Title */
        .title {
            font-size: 50px;
            color: white;
            text-shadow: 6px 6px #3D5C2B, 12px 12px #2B3D1E;
            margin-top: 30px;
            letter-spacing: 3px;
        }

        /* Subtitle with pixel effect */
        .subtitle {
            font-size: 24px;
            color: white;
            text-shadow: 3px 3px #3D5C2B;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        /* Music Button */
        .music-button {
            margin-bottom: 30px;
            padding: 12px 20px;
            font-size: 16px;
            background-color: #3D5C2B;
            color: #FFD700;
            border: none;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            text-transform: uppercase;
            border-radius: 8px;
            box-shadow: 4px 4px #2B3D1E;
        }
        .music-button:hover {
            background-color: #2B3D1E;
        }

        /* Animal container - staggered layout */
        .animals-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            max-width: 1000px;
            margin: 0 auto;
            gap: 40px;
            padding-bottom: 50px;
        }

        /* Animal images - outlined pixelated effect */
        .animal {
            display: inline-block;
            image-rendering: pixelated; /* Makes it look retro */
            border: 4px solid #3D5C2B;
            box-shadow: 6px 6px #2B3D1E;
        }

        /* Different sizes for staggered layout */
        .small { width: 80px; }  
        .medium { width: 120px; } 
        .large { width: 160px; }  
        .extra-large { width: 200px; } /* Bigger dog */
        .extra-medium { width: 140px; } /* Bigger butterfly */

        /* Back to Home Button */
        .back-button {
            margin-top: 50px;
            padding: 15px 25px;
            font-size: 18px;
            background-color: #3D5C2B;
            color: #FFD700;
            border: none;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            text-transform: uppercase;
            border-radius: 8px;
            box-shadow: 4px 4px #2B3D1E;
        }
        .back-button:hover {
            background-color: #2B3D1E;
        }

        /* Pixelated alphabet for extra decoration */
        .pixel-font {
            font-size: 14px;
            color: white;
            text-shadow: 2px 2px #3D5C2B;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <h1 class="title">ANIMALS</h1>
    <h2 class="subtitle">FARM FRIENDS</h2>

    <!-- Music Button -->
    <button class="music-button" onclick="toggleMusic()">🎵 Toggle Music</button>
    <audio id="background-music" loop>
        <source src="audio/Stardew_Valley Fair_Theme.mp3" type="audio/mp3">
        Your browser does not support the audio element.
    </audio>

    <div class="animals-container">
        <img src="images/White_Chicken.png" class="animal small" alt="White Chicken">
        <img src="images/Brown_Chicken.png" class="animal medium" alt="Brown Chicken">
        <img src="images/Blue_Chicken.png" class="animal large" alt="Blue Chicken">
        <img src="images/Void_Chicken.png" class="animal small" alt="Void Chicken">
        <img src="images/Golden_Chicken.png" class="animal medium" alt="Golden Chicken">
        <img src="images/Duck.png" class="animal large" alt="Duck">
        <img src="images/Rabbit.png" class="animal small" alt="Rabbit">
        <img src="images/Ostrich.png" class="animal medium" alt="Ostrich">
        <img src="images/Pig.png" class="animal large" alt="Pig">
        <img src="images/Dog.gif" class="animal extra-large" alt="Dog">
        <img src="images/ButterflyAnimated.gif" class="animal extra-medium" alt="Butterfly">
        <img src="images/Love.png" class="animal small" alt="Love">
        <img src="images/Crow.png" class="animal small" alt="Crow">
        <img src="images/Horse.png" class="animal large" alt="Horse">
        <img src="images/Dinosaur.png" class="animal medium" alt="Dinosaur">
    </div>

    <button class="back-button" onclick="navigateHome()">🏠 Back to Home</button>

    <!-- Pixelated Alphabet Like the Reference Image -->
    <div class="pixel-font">
        
    </div>

    <script>
        let isPlaying = false;
        let audio = document.getElementById("background-music");
        let musicButton = document.querySelector(".music-button");

        // Initial button text
        musicButton.innerText = "🎵 Toggle Music";

        function toggleMusic() {
            if (!isPlaying) {
                audio.play();
                musicButton.innerText = "⏸ Pause Music";
            } else {
                audio.pause();
                musicButton.innerText = "🎵 Play Music";
            }
            isPlaying = !isPlaying;
        }

        // Update button dynamically when audio is played/paused
        audio.onplay = () => {
            isPlaying = true;
            musicButton.innerText = "⏸ Pause Music";
        };
        audio.onpause = () => {
            isPlaying = false;
            musicButton.innerText = "🎵 Play Music";
        };

        function navigateHome() {
            window.history.back(); // Go back dynamically
        }
    </script>

</body>
</html>
