<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stardew Valley - Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            text-align: center;
            background-color: #90c17f;
            font-family: 'VT323', monospace;
            font-size: 20px;
        }
        .title {
            font-size: 32px;
            color: #fff;
            text-shadow: 3px 3px #3d5c2b;
        }
        .tool-list {
            list-style-type: none;
            padding: 0;
        }
        .tool-list li {
            font-size: 24px;
            margin: 10px;
        }
    </style>
</head>
<body>

    <h1 class="title">Tools in Stardew Valley</h1>
    
    <ul class="tool-list">
        <li>⛏️ Pickaxe</li>
        <li>🪓 Axe</li>
        <li>🚜 Hoe</li>
        <li>💧 Watering Can</li>
        <li>🔨 Hammer</li>
        <li>🪚 Scythe</li>
    </ul>

    <button class="button" onclick="navigate('index.html')">🏠 Back to Home</button>

    <script>
        function navigate(page) {
            window.location.href = page;
        }
    </script>

</body>
</html>
