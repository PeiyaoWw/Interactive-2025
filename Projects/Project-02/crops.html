<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Static Stardew Valley Layout</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
  <style>
    body {
      text-align: center;
      background-color: #90c17f;
      font-family: 'VT323', monospace;
      font-size: 20px;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    .farm {
      display: grid;
      grid-template-columns: repeat(5, 64px);
      grid-template-rows: repeat(5, 64px);
      gap: 5px;
      background-color: #5a8f45;
      padding: 10px;
      border-radius: 10px;
    }

    .plot {
      width: 64px;
      height: 64px;
      background-color: #8b5a2b;
      border: 2px solid #654321;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .seeds {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #fff;
      padding: 10px;
      border-radius: 10px;
    }

    .seeds img {
      width: 48px;
      margin: 5px;
    }

    .button {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 18px;
      border: none;
      font-family: 'VT323', monospace;
      border-radius: 5px;
    }

    #musicButton {
      background-color: #f4a261;
    }

    #backToHome {
      background-color: #ff5555;
      color: white;
    }

    .inventory-container {
      margin-top: 15px;
      background: white;
      padding: 10px;
      border-radius: 5px;
      display: inline-block;
      text-align: left;
    }
  </style>
</head>
<body>
  <h1 class="title">Stardew Valley Farm</h1>
  <p>This is a static farm layout with seed selection. Interactive features are disabled.</p>

  <button class="button" id="musicButton">🎵 Toggle Music</button>
  <button class="button" id="backToHome">🏡 Back to Home</button>

  <div class="inventory-container">
    <h3>Inventory</h3>
    <ul>
      <li>carrot: 0</li>
      <li>strawberry: 0</li>
      <li>corn: 0</li>
      <!-- Add more crops if you want -->
    </ul>
  </div>

  <div class="container">
    <!-- Seed Selection Bar -->
    <div class="seeds">
      <h2>Select a Seed</h2>
      <img src="images/Carrot_Seeds.png" alt="Carrot Seeds">
      <img src="images/Strawberry_Seeds.png" alt="Strawberry Seeds">
      <img src="images/Corn_Seeds.png" alt="Corn Seeds">
      <img src="images/Eggplant_Seeds.png" alt="Eggplant Seeds">
      <img src="images/Cranberry_Seeds.png" alt="Cranberry Seeds">
      <img src="images/Garlic_Seeds.png" alt="Garlic Seeds">
      <img src="images/Blueberry_Seeds.png" alt="Blueberry Seeds">
      <img src="images/Melon_Seeds.png" alt="Melon Seeds">
      <img src="images/Pumpkin_Seeds.png" alt="Pumpkin Seeds">
    </div>

    <!-- Farm Grid -->
    <div class="farm">
      <!-- 5x5 Grid -->
      <!-- Each plot is empty -->
      <!-- You can fill some with crops manually if you'd like a "pre-populated" look -->
      <div class="plot"></div>
      <div class="plot"></div>
      <div class="plot"></div>
      <div class="plot"></div>
      <div class="plot"></div>
      <div class="plot"></div>
      <div class="plot"></div>
      <div class="plot"></div>
      <div class="plot"></div>
      <div class="plot"></div>
      <div class="plot"></div>
      <div class="plot"></div>
      <div class="plot"></div>
      <div class="plot"></div>
      <div class="plot"></div>
      <div class="plot"></div>
      <div class="plot"></div>
      <div class="plot"></div>
      <div class="plot"></div>
      <div class="plot"></div>
      <div class="plot"></div>
      <div class="plot"></div>
      <div class="plot"></div>
      <div class="plot"></div>
      <div class="plot"></div>
    </div>
  </div>
</body>
</html>
